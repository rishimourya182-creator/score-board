<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Cricket Zone - Live Scoreboard</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue1:#1d33d6;--blue2:#0a1a8f;--navy:#0a1550;--deep:#050c33;--gold:#ffd23d;--white:#f6f8ff;--cyan:#27e3d0;
  --four:#2fb8ff;--six:#ff7a2f;--wkt:#e8202f;--extra:#ffe94d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:'Barlow Condensed',Arial,sans-serif;color:var(--white)}
body.transparent{background:transparent}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden}
.abs{position:absolute}
#bg{inset:0;background:
  radial-gradient(ellipse 60% 14% at 50% 50%,rgba(255,235,200,.25),transparent 70%),
  linear-gradient(180deg,#0e1a3a 0%,#2b3f6e 22%,#4a5f86 34%,#27582f 44%,#2f7a3a 66%,#173f20 100%)}
#pitch{left:760px;top:520px;width:400px;height:60px;background:#c9b98a;opacity:.55;border-radius:50%;filter:blur(2px)}
body.transparent #bg,body.transparent #pitch{display:none}

/* header */
#head{left:0;top:0;width:1920px;height:270px;background:linear-gradient(180deg,var(--blue1),var(--blue2));border-bottom:5px solid var(--gold)}
.team{position:absolute;top:44px;display:flex;align-items:center;gap:22px}
#batteam{left:30px}#bowlteam{right:30px;flex-direction:row-reverse}
.badge{width:170px;height:170px;border-radius:50%;display:grid;place-items:center;font-size:60px;font-weight:800;
  background:var(--c,#1b4fd8);border:8px solid #fff;box-shadow:0 8px 24px #0008}
.tinfo{display:flex;flex-direction:column;justify-content:center}
.tname{font-size:46px;font-weight:800;letter-spacing:2px;line-height:1}
#bowlteam .tinfo{align-items:flex-end}
.scoreline{display:flex;align-items:baseline;gap:20px;margin-top:6px}
#score{font-size:116px;font-weight:800;line-height:.95;text-shadow:0 5px 12px #0009}
#overs{font-size:52px;font-weight:800;color:var(--gold)}
.bowling{font-size:84px;font-weight:800;line-height:1;margin-top:6px;letter-spacing:2px;
  background:linear-gradient(180deg,#ff5a5a,#c01366 60%,#7a1a8a);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.45))}
#score.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.1);color:var(--gold)}}

#lastball{left:740px;top:60px;width:440px;height:150px;border-radius:75px;background:#000;border:6px solid var(--cyan);
  display:grid;place-items:center;font-size:120px;font-weight:800;box-shadow:0 0 28px rgba(39,227,208,.45)}
#lastball.f{color:var(--four)}#lastball.s{color:var(--six)}#lastball.w{color:var(--wkt)}#lastball.x{color:var(--extra);text-transform:lowercase}
#lastball.pop{animation:pop .5s}

/* stat bar */
#statbar{left:0;top:278px;width:1920px;height:68px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 30px;
  background:linear-gradient(90deg,#d6191f,#c4185a 55%,#5a1db0);border-bottom:4px solid var(--gold);font-size:52px;font-weight:800}
#statbar .l{display:flex;gap:70px}
#statbar b{color:var(--gold)}
#win{display:flex;border-radius:6px;overflow:hidden;font-size:36px;border:3px solid #ffffff55}
#win span{padding:2px 28px}#win .w1{background:#0d2a8c}#win .w2{background:#1b8a63}
#status{justify-self:end;font-size:56px}

/* recent overs */
#recent{left:0;top:354px;width:1920px;height:80px;display:flex;align-items:center;gap:14px;padding:0 20px 0 0;
  background:linear-gradient(90deg,#c4180f,#c4401a);border-bottom:4px solid var(--gold)}
#recent .tag{height:100%;display:grid;place-items:center;padding:0 40px 0 24px;font-size:46px;font-weight:800;font-style:italic;
  background:linear-gradient(90deg,#5a1db0,#1d33d6);border-radius:0 50px 50px 0}
.ov{display:flex;align-items:center;gap:10px;margin-left:30px}
.ov .ol{font-size:30px;font-weight:700;margin-right:6px}
.ov .tot{font-size:52px;font-weight:800;color:var(--gold);margin-left:6px}
.bx{width:70px;height:60px;border-radius:8px;display:grid;place-items:center;font-size:42px;font-weight:800;
  background:linear-gradient(180deg,#1a2fbf,#0a1470);border:3px solid #5b78ff}
.bx.f{border-color:var(--four);box-shadow:0 0 12px var(--four)}.bx.s{border-color:var(--six);box-shadow:0 0 12px var(--six)}
.bx.w{background:var(--wkt);border-color:#fff}.bx.x{background:var(--extra);color:#111;border-color:#fff;text-transform:lowercase}
.bx.e{opacity:.45}

/* next / last */
.pill{top:442px;height:56px;display:flex;align-items:center;justify-content:center;white-space:pre;font-size:36px;font-weight:700;border:4px solid var(--gold);border-radius:28px;
  background:linear-gradient(180deg,#143ac2,#0a1d7a)}
#next{left:20px;width:900px}#lastw{right:20px;width:900px}
.pill span{color:var(--gold)}

/* cards */
.card{top:690px;width:640px;height:350px}
#c1{left:0}#c2{left:640px}#c3{left:1280px}
.lab{position:absolute;left:250px;top:0;width:370px;height:62px;display:flex;align-items:center;gap:14px;padding:0 16px 0 8px;
  background:linear-gradient(180deg,#0e2a9c,#071660);border:4px solid var(--gold);border-radius:20px 20px 0 0;font-size:46px;font-weight:800;z-index:2}
.lab i{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:18px;border:3px solid #fff;background:var(--c)}
.lab em{margin-left:auto;color:var(--gold);font-style:normal;font-size:34px}
.body{position:absolute;left:0;right:0;top:62px;bottom:0;background:linear-gradient(180deg,#143ac2,#050c3a);border:4px solid var(--gold);overflow:visible}
.ph{position:absolute;left:6px;bottom:70px;width:240px;height:300px;display:flex;align-items:flex-end;justify-content:center;z-index:3}
.ph svg,.ph img{height:300px;width:auto;max-width:240px}
.info{position:absolute;left:250px;right:12px;top:6px;text-align:center}
.nm{font-size:46px;font-weight:800;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{font-size:86px;font-weight:800;line-height:1;margin-top:6px}.big small{font-size:48px;font-weight:700;margin-left:8px}
.st{position:absolute;left:0;right:0;bottom:0;height:70px;display:flex;justify-content:space-around;align-items:center;font-size:44px;font-weight:800;background:#040a2c;border-top:3px solid var(--gold)}
.st b{color:var(--gold)}
#c3 .body{background:linear-gradient(180deg,#143ac2,#050c3a)}

.av{animation:bob 1.6s ease-in-out infinite}
.av .bat{transform-origin:84px 78px;animation:swing 2.2s ease-in-out infinite}
.av .arm{transform-origin:84px 74px;animation:arm 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes swing{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(22deg)}}
@keyframes arm{0%{transform:rotate(-30deg)}60%{transform:rotate(200deg)}100%{transform:rotate(-30deg)}}
@media (prefers-reduced-motion:reduce){.av,.av .bat,.av .arm,#score.pop,#lastball.pop{animation:none}}

/* ticker */
#ticker{left:0;bottom:0;width:1920px;height:40px;display:flex;align-items:center;background:linear-gradient(90deg,#c4180f,#a31a6a);border-top:3px solid var(--gold);font-size:30px;font-weight:700;overflow:hidden;white-space:nowrap}
#ticker .t{background:var(--gold);color:#111;padding:0 24px;height:100%;display:grid;place-items:center;font-weight:800}
#ticker span.m{padding:0 24px}

#wait{inset:0;display:grid;place-items:center;text-align:center;font-size:96px;font-weight:800;line-height:1.15;background:linear-gradient(180deg,var(--blue1),var(--deep));z-index:9}
body.transparent #wait{background:transparent;font-size:44px;place-items:end start;padding:0 0 70px 60px;text-align:left}
#stage.nodata>*:not(#wait){visibility:hidden}
.hide{display:none!important}
</style>
</head>
<body>
<div id="stage">
  <div id="bg" class="abs"></div><div id="pitch" class="abs"></div>

  <div id="head" class="abs">
    <div class="team" id="batteam">
      <div class="badge" id="batbadge">IND</div>
      <div class="tinfo"><div class="tname" id="batname">INDIA</div>
        <div class="scoreline"><span id="score">0-0</span><span id="overs">(0.0)</span></div></div>
    </div>
    <div id="lastball" class="abs">-</div>
    <div class="team" id="bowlteam">
      <div class="badge" id="bowlbadge">NZ</div>
      <div class="tinfo"><div class="tname" id="bowlname">NEW ZEALAND</div><div class="bowling">BOWLING</div></div>
    </div>
  </div>

  <div id="statbar" class="abs">
    <div class="l"><span>CRR: <b id="crr">0.00</b></span><span id="pshwrap">P'SHIP: <b id="pship">-</b></span></div>
    <div id="win"><span class="w1" id="w1"></span><span class="w2" id="w2"></span></div>
    <div id="status"></div>
  </div>

  <div id="recent" class="abs"><div class="tag">RECENT</div><div id="ovs" style="display:flex"></div></div>
  <div id="next" class="abs pill"></div>
  <div id="lastw" class="abs pill"></div>

  <div id="c1" class="abs card"></div>
  <div id="c2" class="abs card"></div>
  <div id="c3" class="abs card"></div>

  <div id="ticker" class="abs"><div class="t" id="tk">THE CRICKET ZONE</div><span class="m" id="tktxt"></span></div>
  <div id="wait" class="abs hide">THE CRICKET ZONE<br>MATCH SHURU HONE WALA HAI</div>
</div>

<script>
/* ============ SETTINGS ============ */
const CONFIG = {
  API_URL: "",              // apne Worker ka URL. Khali = demo data
  REFRESH_SECONDS: 5,
  CHANNEL_TAG: "THE CRICKET ZONE",
  PHOTO_FOLDER: "players/"  // yahan player ki apni/licensed image rakho: batter-one.png. "" = sirf cartoon avatar
};
if (new URLSearchParams(location.search).get("transparent")==="1") document.body.classList.add("transparent");

function fit(){
  const s = Math.min(innerWidth/1920, innerHeight/1080);
  $("stage").style.transform = "scale("+s+") translate(-50%,-50%)";
}
const $ = id => document.getElementById(id);
addEventListener("resize", fit); fit();

/* ============ DATA FORMAT (jo field na ho wo section chhup jata hai) ============ */
let match = {
  batTeam:{name:"INDIA", short:"IND", color:"#1b4fd8"},
  bowlTeam:{name:"NEW ZEALAND", short:"NZ", color:"#c4162a"},
  runs:132, wkts:4, overs:13.2,
  status:"NZ opt to bowl",
  winProb:{bat:43, bowl:57},
  partnership:"9 (11)",
  recentOvers:[{n:13,balls:["1","1","1","1","1","1"]},{n:14,balls:["1","Nb","1"]}],
  upcoming:["Next Batter"], lastWicket:"Batter 3  50 (23)",
  bat1:{name:"BATTER ONE", runs:4, balls:7, fours:0, sixes:0, strike:true, photo:""},
  bat2:{name:"BATTER TWO", runs:6, balls:7, fours:0, sixes:0, photo:""},
  bowler:{name:"BOWLER ONE", figures:"1-26 (2.2)", econ:11.14, photo:""}
};

/* ============ HELPERS ============ */
const ballRuns = b => b==="W" ? 0 : (b==="Wd"||b==="Nb") ? 1 : (+b||0);
const ballCls  = b => b==="W"?"w": (b==="Wd"||b==="Nb")?"x": b==="4"?"f": b==="6"?"s":"";
const isLegal  = b => b!=="Wd" && b!=="Nb";
const show = (el, ok) => el.classList.toggle("hide", !ok);

function avatarHTML(kind, color){
  const hold = kind==="bowl"
    ? '<g class="arm"><rect x="80" y="30" width="9" height="46" rx="4" fill="#e0b08a"/></g>'
    : '<g class="bat"><rect x="82" y="30" width="9" height="46" rx="4" fill="#e0b08a"/><rect x="78" y="-6" width="17" height="48" rx="6" fill="#d9a85b"/></g>';
  return '<svg class="av" viewBox="0 -12 120 162" width="200" height="240">'+hold
    +'<path d="M18 150c0-44 16-66 42-66s42 22 42 66z" fill="'+color+'"/>'
    +'<rect x="50" y="62" width="20" height="26" rx="8" fill="#e0b08a"/><circle cx="60" cy="46" r="24" fill="#e0b08a"/>'
    +'<path d="M34 44c0-22 12-32 26-32s26 10 26 32z" fill="'+color+'"/><rect x="30" y="42" width="60" height="7" rx="3" fill="#0b1740" opacity=".55"/>'
    +'<circle cx="51" cy="52" r="2.6" fill="#222"/><circle cx="69" cy="52" r="2.6" fill="#222"/>'
    +'<path d="M52 62q8 6 16 0" stroke="#7a3b22" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>';
}
const slug = n => String(n||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
function photoHTML(p, kind, color){
  const src = p.photo || (CONFIG.PHOTO_FOLDER ? CONFIG.PHOTO_FOLDER + slug(p.name) + ".png" : "");
  if(!src) return avatarHTML(kind,color);
  return '<img src="'+src+'" alt="" onerror="this.outerHTML=avatarHTML(\''+kind+'\',\''+color+'\')">';
}

function card(el, kind, p, team){
  if(!p){ show(el,false); return; }
  show(el,true);
  const color = team.color, photo = photoHTML(p, kind, color);
  const label = '<div class="lab"><i style="--c:'+color+'">'+team.short+'</i>'+(kind==="bat"?"BATSMAN":"BOWLER")+(p.strike?'<em>●</em>':'')+'</div>';
  let mid, stats;
  if(kind==="bat"){
    const sr = p.balls ? (p.runs/p.balls*100).toFixed(2) : "0.00";
    mid = '<div class="nm">'+p.name+'</div><div class="big">'+p.runs+'<small>('+p.balls+')</small></div>';
    stats = '<span>4s: <b>'+(p.fours??0)+'</b></span><span>6s: <b>'+(p.sixes??0)+'</b></span><span>SR: <b>'+sr+'</b></span>';
  } else {
    const f=(p.figures||"").replace(/\s*\(.*\)/,""), o=(p.figures||"").match(/\((.*)\)/);
    mid = '<div class="nm">'+p.name+'</div><div class="big">'+f+'<small>'+(o?o[1]:"")+'</small></div>';
    stats = '<span>Econ: <b>'+(p.econ!=null?Number(p.econ).toFixed(2):"-")+'</b></span>';
  }
  const html = label+'<div class="body"><div class="ph">'+photo+'</div><div class="info">'+mid+'</div><div class="st">'+stats+'</div></div>';
  if(el._h!==html){ el.innerHTML=html; el._h=html; }
}

let lastScore="", lastBall="";
function render(m){
  const tb = Math.floor(m.overs)*6 + Math.round((m.overs%1)*10);
  const crr = tb ? m.runs/tb*6 : 0, sc = m.runs+"-"+m.wkts;

  $("batname").textContent=m.batTeam.name; $("bowlname").textContent=m.bowlTeam.name;
  $("batbadge").textContent=m.batTeam.short; $("batbadge").style.setProperty("--c",m.batTeam.color);
  $("bowlbadge").textContent=m.bowlTeam.short; $("bowlbadge").style.setProperty("--c",m.bowlTeam.color);
  $("score").textContent=sc; $("overs").textContent="("+m.overs.toFixed(1)+")";
  if(sc!==lastScore && lastScore){const s=$("score");s.classList.remove("pop");void s.offsetWidth;s.classList.add("pop");}
  lastScore=sc;

  // last ball (beech wala bada box)
  const ro=m.recentOvers||[], cur=ro[ro.length-1], lb=cur&&cur.balls.length?cur.balls[cur.balls.length-1]:"";
  const box=$("lastball"); box.textContent = lb || "LIVE"; box.style.fontSize = lb ? "" : "80px";
  box.className = "abs "+(lb?ballCls(lb):"");
  if(lb && lb+ro.length+(cur?cur.balls.length:0)!==lastBall && lastBall){void box.offsetWidth;box.classList.add("pop");}
  lastBall = lb+ro.length+(cur?cur.balls.length:0);

  $("crr").textContent=crr.toFixed(2);
  show($("pshwrap"), !!m.partnership); $("pship").textContent=m.partnership||"";
  show($("win"), !!m.winProb);
  if(m.winProb){ $("w1").textContent=m.bowlTeam.short+" "+m.winProb.bowl+"%"; $("w2").textContent=m.batTeam.short+" "+m.winProb.bat+"%"; }
  $("status").textContent=m.status||"";

  show($("recent"), ro.length>0);
  $("ovs").innerHTML = ro.slice(-2).map(o=>{
    const tot=o.balls.reduce((a,b)=>a+ballRuns(b),0), legal=o.balls.filter(isLegal).length;
    let h='<div class="ov"><span class="ol">OVER: '+o.n+'</span>'+o.balls.map(b=>'<div class="bx '+ballCls(b)+'">'+b+'</div>').join("");
    for(let i=legal;i<6;i++) h+='<div class="bx e"></div>';
    return h+'<span class="tot">= '+tot+'</span></div>';
  }).join("");

  const nx=(m.upcoming||[])[0];
  show($("next"), !!nx); $("next").innerHTML='Next Batsman: <span>&nbsp;'+(nx||"")+'</span>';
  show($("lastw"), !!m.lastWicket); $("lastw").innerHTML='Last Wkt: <span>&nbsp;'+(m.lastWicket||"")+'</span>';

  card($("c1"),"bat",m.bat1,m.batTeam); card($("c2"),"bat",m.bat2,m.batTeam); card($("c3"),"bowl",m.bowler,m.bowlTeam);

  const tk = m.ticker || [m.bat1,m.bat2].filter(Boolean).map(b=>b.name+" "+b.runs+" ("+b.balls+")").join("  -  ");
  $("tktxt").textContent = tk ? "BATSMAN RUNS: "+tk : "";
  $("tk").textContent = CONFIG.CHANNEL_TAG;
}

/* ============ LIVE DATA ============ */
const setWait = on => { $("wait").classList.toggle("hide",!on); $("stage").classList.toggle("nodata",on); };
async function fetchLive(){
  try{
    const r = await fetch(CONFIG.API_URL,{cache:"no-store"});
    const d = await r.json();
    if(!r.ok || d.error) throw new Error(d.error || r.status);
    match = d; render(match); setWait(false);
  }catch(e){ console.warn("API:", e.message || e); }
}

/* Demo (sirf jab API_URL khali ho) */
function demoBall(){
  const pool=["0","1","1","2","4","6","W","1","Wd","1"];
  const o=pool[Math.floor(Math.random()*pool.length)];
  const cur=match.recentOvers[match.recentOvers.length-1];
  cur.balls.push(o);
  if(o==="W") match.wkts=Math.min(10,match.wkts+1); else match.runs+=ballRuns(o);
  if(isLegal(o)){
    if(o!=="W"){ match.bat1.runs+=(+o||0); match.bat1.balls++; if(o==="4")match.bat1.fours++; if(o==="6")match.bat1.sixes++; }
    let b=Math.round((match.overs%1)*10)+1, ov=Math.floor(match.overs); if(b===6){ov++;b=0;} match.overs=ov+b/10;
  }
  if(cur.balls.filter(isLegal).length>=6){ match.recentOvers.push({n:cur.n+1,balls:[]}); match.recentOvers=match.recentOvers.slice(-2); }
  render(match);
}

if(CONFIG.API_URL){ setWait(true); fetchLive(); setInterval(fetchLive, CONFIG.REFRESH_SECONDS*1000); }
else { render(match); setInterval(demoBall, 3500); }
</script>
</body>
</html>
